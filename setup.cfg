[metadata]
name = ossp-2026-llm-router-challenge
version = 0.1.0
description = Prompt-only router protocol and local scorer for the OSSP 2026 challenge
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files =
    LICENSE
    NOTICE
    LICENSES/Apache-2.0.txt

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
ossp_router.resources =
    *.json

[options.entry_points]
console_scripts =
    ossp-router = ossp_router.cli:main
    router-cleanup-resources = ossp_router.runtime:cleanup_main
    router-evaluate-tier = ossp_router.orchestrator:main
    router-measure-image = ossp_router.image_evidence:main
    router-measure-tiebreak = ossp_router.tiebreak_latency:main
    router-run = ossp_router.heuristic:main
    router-self-check = ossp_router.cli:self_check_entry
